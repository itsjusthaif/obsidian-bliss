name: Release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must equal the manifest version, with no v prefix
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "$GITHUB_REF_NAME" = "$v" ] || { echo "tag $GITHUB_REF_NAME must equal manifest version $v (Obsidian requires no 'v' prefix)"; exit 1; }
      - run: npm test
      - name: Release notes from CHANGELOG.md
        run: |
          v=$(node -p "require('./manifest.json').version")
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG entry for $v"; exit 1; }
      - name: Create release with theme assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" theme.css manifest.json --title "Bliss $GITHUB_REF_NAME" --notes-file notes.md
